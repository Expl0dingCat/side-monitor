float sunShade(vec2 xz) {

// dither value, 0..1), so it reads as a gradual change, not as bands.
float lightLevel(vec2 xz, vec3 N, float grain) {

  return floor(sunShade(xz) * (0.2 + 0.8 * facing) * 8.0 + grain) / 8.0;

// a small pool round each, which is all a candle behind glass can do.
float lanternPool(vec2 xz) {

  for (int i = 0; i < 8; i++) {
    vec2 d = xz - uTaskLamp[i].xz;
    float l = clamp(1.0 - sqrt(dot(d, d) + 0.3) / 3.3, 0.0, 1.0);

// smoothly with distance, in many fine steps that are stippled into one
// another (grain is a dither value, 0..1), so there is no hard edge to it.
vec3 warmLight(vec3 wpos, float grain) {

// light arrives (the sky's, the sun's straight and bounced, the fire's, the lanterns'), so their colour

// morning, a rock's). 1 where no light has been gathered.

// PATH-TRACE: the light rays found on the ground where a thing stands, for a thing they do not know of
// (the rowing boat on the beach, a fish on the rack): how much of the sun's own light reaches there (x)
// and how much of the sky's (y), each against open ground. It is read at the one spot for the whole of
// the thing, so that a hull seen half against the beach and half against the sea is lit as one. (1, 1)
// where no light has been gathered.
vec2 tracedAt(vec3 where) {

  float skyShare = N.y > 0.55 ? 1.0 : 0.76;

// deep cool green in the damper ground, through lush green, to dry yellow-green,
// one grading gently into the next.
vec3 grassAlbedo(vec2 xz, float grain) {
  float broad = texture(uNoise, xz * 0.011).a * 0.7 + texture(uNoise, xz * 0.0031 + 0.4).r * 0.3;

  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <main id="hud">
      <div id="clock"></div>
      <div id="more">
        <div id="where-when">
          <span id="date"></span>
          <span class="sep" aria-hidden="true">·</span>
          <button id="place" type="button" title="change the place"></button>
        </div>
        <div id="weather-line"></div>
        <div id="hint-line"></div>

        <form id="place-form" hidden>
          <input id="place-input" type="text" autocomplete="off" spellcheck="false" aria-label="your city" placeholder="a city, then enter" />
          <div class="row">
            <button type="button" id="place-auto">find my city</button>
            <button type="button" id="place-geo">use precise location</button>
          </div>
          <div id="place-error" role="status"></div>
        </form>
      </div>
    </main>

    <div id="tune" role="status"></div>
    <div id="sky-name" role="status"></div>
    <div id="lamb-word" role="status"></div>
    <div id="name-away" aria-hidden="true"></div>
    <div id="word" role="status"></div>
    <form id="music-form" hidden>
      <label for="music-id" id="music-ask"></label>
      <a id="music-link" target="_blank" rel="noopener noreferrer" hidden>open spotify's sign-in</a>
      <input id="music-id" type="text" autocomplete="off" spellcheck="false" placeholder="spotify client id" />
      <div class="row">
        <button type="submit" id="music-go">connect</button>
        <button type="button" id="music-cancel">not now</button>
        <button type="button" id="music-forget" hidden>forget spotify</button>
      </div>
      <div id="music-note"></div>
    </form>

    <div id="hush" aria-hidden="true"></div>

    <section id="notes" hidden aria-label="Notes kept by the stone">
      <textarea id="notes-text" spellcheck="false" placeholder="write, and the stone will keep it…"></textarea>
      <div id="notes-status" role="status"></div>
    </section>

    <div id="bottle-hush" aria-hidden="true"></div>
    <section id="bottle" hidden aria-label="A message in a bottle">
      <textarea id="bottle-text" spellcheck="false" placeholder="write to yourself, and the sea will bring it back…"></textarea>
      <div id="bottle-line" role="status"></div>
    </section>

  </body>
</html>
